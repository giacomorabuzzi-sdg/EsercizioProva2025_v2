models:

  - name: scd2_customers
    description: "Tabella della dimensione Clienti implementata con la strategia **SCD Tipo 2**. Mantiene la **cronologia completa** delle modifiche agli attributi dei clienti, utilizzando colonne di data di validità (`valid_from_date`, `valid_to_date`) e un flag per identificare il record corrente (`is_current`)."
    columns:
      - name: customer_id
      - name: customer_cd
      - name: name
      - name: email
      - name: city
      - name: member_since
      - name: last_update
      - name: is_deleted
      - name: dbt_updated_at
      - name: valid_from
      - name: valid_to
      - name: is_current
